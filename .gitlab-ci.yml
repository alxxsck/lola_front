# GitLab pipeline for Lola CMS — build & push a container image.
# Deployment is GitOps: Flux image-automation on k3s-prod picks up the newest
# `main-<ts>-<sha>` tag and rolls out the nginx/SPA image. (Cloudflare Pages deploy
# has been replaced by the container build.)

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - image

variables:
  NODE_IMAGE: 'node:22-alpine'
  BUILDKIT_IMAGE: 'moby/buildkit:v0.30.0-rootless'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  VITE_DATA_MODE: 'api'
  APP_IMAGE_TAG: '$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA'
  BUILDKIT_CACHE_REF: '$CI_REGISTRY_IMAGE/cache:buildkit-$CI_COMMIT_REF_SLUG'
  BUILDKIT_DEFAULT_CACHE_REF: '$CI_REGISTRY_IMAGE/cache:buildkit-$CI_DEFAULT_BRANCH'

quality:
  stage: verify
  image: '$NODE_IMAGE'
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - apk add --no-cache git
    - npm ci --prefer-offline --no-audit
  script:
    - npm run lint
    - npm run typecheck
    # Catch OpenAPI/generated-client drift here (fast) rather than only in build:image.
    - npm run api:check
    - npm test
    - npm run test:scripts

build:image:
  stage: image
  image:
    name: '$BUILDKIT_IMAGE'
    entrypoint: ['']
  interruptible: true
  timeout: 30m
  variables:
    BUILDKITD_FLAGS: '--oci-worker-no-process-sandbox'
    # Job-scoped: must NOT be a top-level var — it would land in the test job's
    # env, flip import.meta.env.VITE_API_BASE_URL to /api/v1, and break the
    # realtime-client test (which expects the http://localhost:3000 default).
    VITE_API_BASE_URL: '/api/v1'
  needs:
    - job: quality
      artifacts: false
  before_script:
    - umask 077
    - mkdir -p "$HOME/.docker"
    - |
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > "$HOME/.docker/config.json"
  script:
    # Push only on the default branch (main); MRs/branches build to validate.
    - PUSH=false
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then PUSH=true; fi
    - FLUX_TAG="main-$(date -u +%Y%m%d%H%M%S)-${CI_COMMIT_SHORT_SHA}"
    - FLUX_IMAGE="$CI_REGISTRY_IMAGE:$FLUX_TAG"
    - echo "PUSH=$PUSH building $APP_IMAGE_TAG and $FLUX_IMAGE"
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt target=production \
        --opt "build-arg:NODE_IMAGE=$NODE_IMAGE" \
        --opt "build-arg:VITE_API_BASE_URL=$VITE_API_BASE_URL" \
        --opt "build-arg:VITE_DATA_MODE=$VITE_DATA_MODE" \
        --import-cache "type=registry,ref=$BUILDKIT_DEFAULT_CACHE_REF" \
        --import-cache "type=registry,ref=$BUILDKIT_CACHE_REF" \
        --export-cache "type=registry,ref=$BUILDKIT_CACHE_REF,mode=max" \
        --output "type=image,\"name=$APP_IMAGE_TAG,$FLUX_IMAGE\",push=$PUSH"
  # MR pipelines build to validate (push=false, automatic). On main the image is
  # built + pushed only when you click ▶️ (or Run Pipeline) — the manual deploy gate.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
